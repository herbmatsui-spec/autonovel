# Shared Beat Dictionary
pause:
  short:
    - "……"
    - "一瞬、間が開く"
    - "静寂が張り詰める"
    - "言葉が途切れる"
  long:
    - "長い沈黙が流れる"
    - "数秒、何も言葉が返ってこない"
    - "重苦しい静寂が部屋を支配する"

breath:
  sigh:
    - "深く息を吐く"
    - "微かな吐息を漏らす"
    - "ため息を呑み込む"
  gasp:
    - "息を呑む"
    - "息を詰まらせる"

silence:
  chilly:
    - "凍りつくような沈黙"
    - "氷のような冷たい間"
  tense:
    - "張り詰めた糸のような静寂"
    - "呼吸すら憚られる静寂"
