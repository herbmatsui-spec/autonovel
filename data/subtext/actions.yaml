# Shared Actions Dictionary
gaze:
  down:
    - "伏し目がちに視線を落とす"
    - "手元に視線を落とす"
    - "影を落とした瞳で床を見つめる"
  away:
    - "視線を静かに逸らす"
    - "窓の外へと目を向ける"
    - "横を向き、横顔を隠す"
  piercing:
    - "射抜くような眼差しを向ける"
    - "冷徹な光を瞳に宿して見据える"

hands:
  hide:
    - "震える指先をマントの奥へ隠した"
    - "拳を握りしめ、袖の中に押し込んだ"
    - "ポケットの奥で爪を立てた"
  fiddle:
    - "指先で杯の縁をなぞる"
    - "チェスの駒を転がす"
    - "ペンの重みを確かめるように弄ぶ"
  restrain:
    - "手を膝の上で固く組み直した"
    - "机に手をつき、わずかに体重を預けた"

body:
  retreat:
    - "半歩だけ静かに後ずさる"
    - "わずかに重心を後ろへ移す"
  tense:
    - "背筋を強張らせ、身構える"
    - "肩を微かに強張らせる"
