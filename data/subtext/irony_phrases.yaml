# Shared Irony Phrases Dictionary
cold_acceptance:
  - "そう。好きにすればいいわ"
  - "ええ、お望みの通りに"
  - "結構な判断ですこと"
  - "君の期待に応えられなくて残念だ"

skeptical:
  - "君に何が分かる"
  - "期待しないことにする"
  - "ずいぶんと立派な御託ね"
  - "信じるに値する根拠があればいいが"

polite_dismissal:
  - "余計なお気遣い、痛み入ります"
  - "ご親切にどうも。役に立つと良いですね"
  - "素晴らしいお考えですね。他で試されては？"
