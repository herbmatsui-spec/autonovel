services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autonovel_backend
    ports:
      - "8200:8200"
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./src:/app/src
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autonovel_worker
    command: python -m huey.bin.huey_consumer src.backend.tasks.huey
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./src:/app/src
    depends_on:
      backend:
        condition: service_healthy

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: autonovel_frontend_dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      backend:
        condition: service_healthy
