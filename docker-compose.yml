services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autonovel_backend
    ports:
      - "8200:8200"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://autonovel:autonovel@db:5432/autonovel
      - REDIS_URL=redis://redis:6379/0
      - HUEY_BACKEND=redis
      - LOG_LEVEL=INFO
      - LLM_PROVIDER=${LLM_PROVIDER:?LLM_PROVIDER is required}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://localhost:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://localhost:8000}
      - VLLM_MODEL=${VLLM_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autonovel_worker
    entrypoint: ["/usr/local/bin/entrypoint.sh", "--skip-migrations"]
    command: ["python", "-m", "huey.bin.huey_consumer", "src.backend.tasks.huey.huey", "-w", "2", "-k", "thread"]
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://autonovel:autonovel@db:5432/autonovel
      - REDIS_URL=redis://redis:6379/0
      - HUEY_BACKEND=redis
      - LOG_LEVEL=INFO
      - LLM_PROVIDER=${LLM_PROVIDER:?LLM_PROVIDER is required}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://localhost:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://localhost:8000}
      - VLLM_MODEL=${VLLM_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./storage:/app/storage
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: apache/age-postgresql:16-pgvector
    container_name: autonovel_db
    environment:
      - POSTGRES_USER=autonovel
      - POSTGRES_PASSWORD=autonovel
      - POSTGRES_DB=autonovel
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autonovel -d autonovel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: autonovel_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: autonovel_frontend_dev
    ports:
      - "5173:5173"
#    volumes:
#      - ./frontend:/app
#      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_BACKEND_URL=http://backend:8200
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
