services:
  redis:
    image: redis:7-alpine
    container_name: kaku_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  backend:
    image: kaku_backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kaku_backend
    command: uvicorn src.backend.server:app --host 0.0.0.0 --port 8200
    ports:
      - "8200:8200"
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - app_storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy

  worker:
    image: kaku_backend:latest
    container_name: kaku_worker
    command: python -m huey.bin.huey_consumer src.backend.tasks.huey
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - app_storage:/app/storage
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: kaku_frontend_dev
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true

  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: kaku_frontend_prod
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  app_storage:
  redis_data:
