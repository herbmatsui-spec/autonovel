# [LEGACY] MyPy Configuration
# Primary MyPy settings are stored in pyproject.toml under [tool.mypy].
# This file is kept for backward compatibility with external tools/scripts.
[mypy]
python_version = 3.12
mypy_path = autonovel/src
disallow_untyped_defs = False
check_untyped_defs = True
warn_return_any = False
warn_unused_configs = True
ignore_missing_imports = True

[mypy.autonovel.src.*]
ignore_errors = False
