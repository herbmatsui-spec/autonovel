[pytest]
pythonpath = .
testpaths = tests
norecursedirs = .git scripts node_modules storage autonovel .venv .hypothesis
addopts = 
    -p no:cacheprovider
    -p no:debugging
    --import-mode=importlib
    --tb=short
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    perf: Performance benchmark tests