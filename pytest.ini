[pytest]
# -p no:debugging: Python 3.14 + pytest-debugging の pluggy MemoryError 回避（暫定措置）。
#   恒久対応は pytest-debugging の更新。解除する場合は CI で 1 回だけ確認すること。
pythonpath = .
testpaths = tests
norecursedirs = .git scripts node_modules storage autonovel .venv .hypothesis
addopts = 
    -p no:cacheprovider
    -p no:debugging
    --import-mode=importlib
    --tb=short
    --timeout=120
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    perf: Performance benchmark tests
    slow: 長時間を要するテスト
    integration: 外部サービス結合テスト