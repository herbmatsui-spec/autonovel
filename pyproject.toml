[project]
name = "autonovel"
version = "5.2.0"
description = "AutoNovel - 小説生成エンジン (FastAPI + React + Huey + SQLAlchemy)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "email-validator>=2.0.0",
    "sqlalchemy>=2.0",
    "huey>=2.5",
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
    "asyncpg>=0.30.0",
    "redis>=5.0",
    "python-json-logger>=2.0",
    "openai>=1.20",
    "google-genai>=0.8.0",
    "protobuf>=5.29.0",
    "google-api-core>=2.25.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    "jinja2>=3.1.4",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "aiosqlite>=0.19.0",
    "dependency-injector>=4.41.0",
]

[project.scripts]
# Step 24: 統一 CLI エントリポイント
autonovel = "src.cli.main:main"
# 旧スクリプトのエイリアス（後方互換）
dsp-balance = "src.narrative_balancer.dsp.cli:main"
csp-balance = "src.narrative_balancer.csp.cli:main"
grammar-balance = "src.narrative_balancer.grammar.cli:main"
global-balance = "src.narrative_balancer.arbitrator.cli:main"


[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "ruff>=0.3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "testcontainers>=4.14.2",
]
rag = [
    "chromadb>=1.5.0,<2.0.0",
    "rank-bm25>=0.2.2",
    "pgvector>=0.3.0",
    "sentence-transformers>=2.6.0",
]
nlp = [
    "sudachipy>=0.6.0,<0.7",
    "sudachidict-core>=20230109",
    "sudachidict-full>=20230109",
    "sudachidict-small>=20230109",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", "scripts", "node_modules", "storage", "autonovel"]
addopts = "-p no:cacheprovider --import-mode=importlib --tb=short"
asyncio_mode = "auto"
markers = [
    "perf: Performance benchmark tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/alembic/*",
    "*/conftest.py",
    "*/__pycache__/*",

    # =========================================================================
    # 【警告】以下のリストはテスト実行時の「カバレッジ測定除外対象」の定義です。
    # 「デッドコード」ではありません！スクリプトやツールで物理削除しないでください！
    # =========================================================================
    # パッケージマーカー（行カバレッジ対象外）
    "src/__init__.py",
    "src/*/__init__.py",
    "src/*/*/__init__.py",
    "src/*/*/*/__init__.py",

    # 非推奨スタブモジュール
    "src/services/age_client.py",
    "src/services/llm/provider_failover.py",
    "src/services/state_manager.py",
]
branch = true
concurrency = ["multiprocessing", "thread"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
show_error_codes = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
"*" = ["E402"]
