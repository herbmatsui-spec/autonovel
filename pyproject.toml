[project]
name = "autonovel"
version = "4.9.3"
description = "AutoNovel - 小説生成エンジン (FastAPI + React + Huey + SQLAlchemy)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "huey>=2.5",
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
    "asyncpg>=0.30.0",
    "redis>=5.0",
    "python-json-logger>=2.0",
    "openai>=1.20",
    "google-generativeai>=0.8.3",
    "protobuf==5.29.5",
    "google-api-core==2.25.2",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    "jinja2>=3.1.4",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "aiosqlite>=0.19.0",
    "dependency-injector>=4.41.0",
    "cachetools>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "ruff>=0.3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "testcontainers>=4.14.2",
]
rag = [
    "chromadb>=1.5.0,<2.0.0",
    "rank-bm25>=0.2.2",
    "pgvector>=0.3.0",
    "sentence-transformers>=2.6.0",
]
nlp = [
    "sudachipy>=0.6.0,<0.7",
    "sudachidict-core>=20230109",
    "sudachidict-full>=20230109",
    "sudachidict-small>=20230109",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", "scripts", "node_modules", "storage", "autonovel"]
addopts = "-p no:cacheprovider --import-mode=importlib --tb=short --cov=src --cov-branch --cov-fail-under=80"
asyncio_mode = "auto"
markers = [
    "perf: Performance benchmark tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/alembic/*",
    "*/conftest.py",
    "*/__pycache__/*",

    # --- 未参照デッドモジュール（どのモジュール/テストからも参照なし） ---
    # src 直下
    "src/__init__.py",

    # agents 配下の未参照
    "src/agents/social/__init__.py",
    "src/agents/writing/bible_extractor.py",
    "src/agents/writing/rewrite_orchestrator.py",

    # backend 配下の未参照
    "src/backend/health/__init__.py",
    "src/backend/observability/__init__.py",
    "src/backend/observability/graph_metrics.py",
    "src/backend/schemas/__init__.py",

    # core 配下の未参照
    "src/core/__init__.py",
    "src/core/async_executor.py",
    "src/core/dag/__init__.py",
    "src/core/otel_setup.py",
    "src/core/spi/__init__.py",
    "src/core/spi/image/__init__.py",
    "src/core/spi/llm/__init__.py",
    "src/core/spi/llm/legacy_spi_bridge.py",
    "src/core/spi/vector_store/__init__.py",
    "src/core/state/__init__.py",

    # domain 配下の未参照（旧世代モデル/VO）
    "src/domain/__init__.py",
    "src/domain/domain_services/__init__.py",
    "src/domain/entities/__init__.py",
    "src/domain/repositories/__init__.py",
    "src/domain/value_objects/__init__.py",
    "src/domain/value_objects/character_role.py",
    "src/domain/value_objects/erotic_intensity.py",
    "src/domain/value_objects/genre.py",
    "src/domain/value_objects/plot_tension.py",

    # easy_mode / engine 配下の未参照
    "src/easy_mode/phase3/__init__.py",
    "src/engine/__init__.py",
    "src/engine/prompts/__init__.py",

    # infrastructure 配下の未参照
    "src/infrastructure/__init__.py",
    "src/infrastructure/api/__init__.py",
    "src/infrastructure/api/client.py",
    "src/infrastructure/config/__init__.py",
    "src/infrastructure/database/__init__.py",
    "src/infrastructure/external/__init__.py",
    "src/infrastructure/external/anthropic_client.py",
    "src/infrastructure/persistence/__init__.py",
    "src/infrastructure/queue/__init__.py",
    "src/infrastructure/repository.py",

    # kernels（実装済み新エンジンから未参照の旧設計）
    "src/kernels/*",

    # legacy（v4.x 以前の非推奨実装、参照ゼロを確認済み）
    "src/legacy/*",

    # llm 旧世代クライアント（src/llm は src/core.llm / src/services に統合済み）
    "src/llm/cost_budget_guard.py",
    "src/llm/cost_metrics.py",
    "src/llm/cost_router.py",
    "src/llm/gemini_client.py",
    "src/llm/models.py",
    "src/llm/provider_factory.py",
    "src/llm/task_recovery.py",

    # models / presets 配下の未参照
    "src/models/cadence_intelligent.py",
    "src/models/easy_mode_schemas.py",
    "src/presets/__init__.py",

    # services 配下の未参照
    "src/services/auditors/__init__.py",
    "src/services/cadence/__init__.py",
    "src/services/cadence/local_llm_refiner.py",
    "src/services/content_processor.py",
    "src/services/context_cache_service.py",
    "src/services/exporters/__init__.py",
    "src/services/formatters/__init__.py",
    "src/services/graph/cypher_translator.py",
    "src/services/graph/hybrid_graph_facade.py",
    "src/services/illustration/character_lora_mapper.py",
    "src/services/illustration/comfyui_client.py",
    "src/services/llm/__init__.py",
    "src/services/llm/legacy_adapter_bridge.py",
    "src/services/llm/provider_failover.py",
    "src/services/nlp/__init__.py",
    "src/services/unified_pipeline_config.py",
    "src/services/plot_service.py",
    "src/services/state_manager.py",
    "src/services/narrative_scoring_service.py",

    # shared 配下の未参照
    "src/shared/__init__.py",
    "src/shared/redis_pool.py",

    
]
branch = true
concurrency = ["multiprocessing", "thread"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
show_error_codes = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "G004"]
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
"*" = ["E402"]
