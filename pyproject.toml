[project]
name = "autonovel"
version = "4.4.0"
description = "AutoNovel - 小説生成エンジン (FastAPI + React + Huey + SQLAlchemy)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "huey>=2.5",
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "python-json-logger>=2.0",
    "openai>=1.20",
    "google-generativeai>=0.5.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    "jinja2>=3.1.4",
    "pandas>=2.0.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "aiosqlite>=0.19.0",
    "dependency-injector>=4.41.0",
    "cachetools>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "ruff>=0.3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "testcontainers[postgresql,redis,wiremock]>=3.0",
]
rag = [
    "chromadb>=1.5.0,<2.0.0",
    "rank-bm25>=0.2.2",
    "pgvector>=0.3.0",
    "sentence-transformers>=2.6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]