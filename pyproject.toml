[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "streamlit.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C90"] # Pyflakes, Pycodestyle, Isort, Complexity
ignore = ["E501"] # Line too long (handled by formatter/line-length)

[tool.ruff.lint.per-file-ignores]

[tool.ruff.lint.mccabe]
max-complexity = 15

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kaku-hegemony"
version = "3.0.0"
description = "覇権小説エンジン"
requires-python = ">=3.12"
dependencies = [
    "nest-asyncio>=1.5.0",
    "google-genai>=0.8.0",
    "aiosqlite>=0.19.0",
    "pydantic>=2.7.0",
    "jinja2>=3.1.4",
    "pandas>=2.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "requests>=2.32.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "dependency-injector>=4.41.0",
    "chromadb>=0.5.0",
    "redis>=5.0.0",
    "huey>=1.1.0",
    "python-json-logger>=2.0.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "opentelemetry-instrumentation>=0.47b0",
    "opentelemetry-instrumentation-fastapi>=0.47b0",
    "opentelemetry-instrumentation-logging>=0.47b0",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.5.0",
    "pytest-docker>=3.2.0",
    "testcontainers>=4.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=4.0.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*", "schemas*", "services*", "prompts*", "formatters*", "models*", "plugins*", "kernels*"]

[tool.coverage.run]
source = ["src", "streamlit_app"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
