[tool.mypy]
python_version = "3.12"
files = ["src"]
exclude = ["temp/", "backup/", "archive/", ".*egg-info/"]
explicit_package_bases = true
ignore_missing_imports = true
strict = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["temp", "backup", "archive", ".kilo", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C90"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["temp", "backup", "archive", "frontend", "node_modules"]
addopts = "-p no:cacheprovider --import-mode=importlib"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonovel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "huey>=2.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["mypy>=1.8", "ruff>=0.3", "pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
