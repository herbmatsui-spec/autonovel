[tool.mypy]
python_version = "3.12"
files = ["src"]
exclude = ["temp/", "backup/", "archive/", ".*egg-info/"]
explicit_package_bases = true
ignore_missing_imports = true
strict = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["temp", "backup", "archive", ".kilo", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C90", "UP"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["temp", "backup", "archive", "frontend", "node_modules"]
addopts = "-p no:cacheprovider --import-mode=importlib -q --tb=short --strict-markers"
asyncio_mode = "auto"
markers = [
    "asyncio: pytest-asyncio で実行する非同期テスト",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonovel"
version = "0.2.0"
description = "AutoNovel - 小説生成エンジン (FastAPI + React + Huey + SQLAlchemy)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "huey>=2.5",
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "python-json-logger>=2.0",
    "openai>=1.20",
    "google-generativeai>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "ruff>=0.3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
