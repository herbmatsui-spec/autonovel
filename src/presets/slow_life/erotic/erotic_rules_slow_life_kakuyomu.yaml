# スローライフジャンル・カクヨム投稿用 官能表現ルール
platform: "kakuyomu"
genre: "slow_life"
max_intensity_level: 1

intensity_levels:
  1:
    name: "暗示的（上限）"
    description: "心理的緊張・雰囲気醸成のみ。手をつなぐ・抱擁・頬にキス・頭撫でる・並んで寝る程度。『温もり・安心感・信頼』の表現に徹する。"
    allowed: true
    examples:
      - "彼女の手を、そっと握り返す。冷たかった指先が、じんわり温まる。"
      - "寝息を立てる彼女の髪を、優しく梳く。これが、僕の『守る』ということだ。"
  2:
    name: "情緒的（制限）"
    allowed: false
    action: "downgrade_to_lv1"
  3:
    name: "官能的（NG）"
    allowed: false
    action: "block"
  4:
    name: "直接的（NG）"
    allowed: false
    action: "block"
  5:
    name: "過激（NG）"
    allowed: false
    action: "block"

ng_words:
  - "キス"
  - "抱擁"
  - "肌"
  - "体温"
  - "吐息"
  - "唇"
  - "ベッド"
  - "夜"
  - "寝室"
  - "脱ぐ"
  - "裸"
  - "愛撫"
  - "快感"
  - "喘ぎ"
  - "濡れ"
  - "蜜"
  - "果てる"
  - "絶頂"

auto_replace:
  "キス": "口づけ（頬・額）"
  "抱擁": "抱きしめる"
  "肌": "頬/手"
  "体温": "温もり"
  "吐息": "息"
  "唇": "口元"
  "ベッド": "布団/寝床"
  "夜": "夜更け"
  "寝室": "部屋"
  "脱ぐ": "着替える"
  "裸": "素肌（描写しない）"
  "愛撫": "撫でる"
  "快感": "安心感"
  "喘ぎ": "寝息"
  "濡れ": "潤む（目）"
  "蜜": "蜂蜜/シロップ"
  "果てる": "眠る"
  "絶頂": "極み（料理等）"

scene_placement_rules:
  - "恋愛要素がある場合、『手をつなぐ・頭を撫でる・並んで寝る』等の『温もり・安心感』表現のみ許可"
  - "メインは『料理・農業・クラフト・会話・動物との触れ合い』等の非恋愛的癒やし"
  - "ハーレム・三角関係・嫉妬劇等のドロドロ要素は原則なし（コメディ・即解決のみ）"

required_tags:
  - "ほのぼの"
  - "癒やし"
  - "スローライフ"
  - "料理"
  - "農業"
  - "異世界"
  - "ファンタジー"

safety_manifest_injection: true
manifest_version: "slow_life_v1"