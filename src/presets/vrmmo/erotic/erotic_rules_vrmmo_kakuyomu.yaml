# VRMMOジャンル・カクヨム投稿用 官能表現ルール
platform: "kakuyomu"
genre: "vrmmo"
max_intensity_level: 2

intensity_levels:
  1:
    name: "暗示的"
    description: "心理的緊張・雰囲気醸成。視線・距離感・アバター接触・ハプティックフィードバック・神経リンク同期等。物理接触は手をつなぐ・抱擁・軽いキス程度。"
    allowed: true
  2:
    name: "情緒的（上限）"
    description: "キス・抱擁・アバター同士の『データ同期・神経リンク全開・感覚共有・感情同期・記憶共有』等の『システム的・VR的』親密行為。現実身体での行為ではなく『アバター・アカウント・データ』レベルでの完全同期。比喩（データ洪水・同期完了・チェックサム一致・ハッシュ一致・暗号化通信・量子もつれ・量子テレポーテーション）で美的に。"
    allowed: true
    conditions:
      - "相手は『パートナーNPC/ヒロインNPC/プレイヤー/AI/管理者』等、アカウントレベルで信頼関係ある相手"
      - "『神経リンク同期・感覚共有・フルダイブ同期・フルダイブフル同期・脳波同期・量子もつれ同期』等のVR/技術的必然性ありき"
      - "事後は『同期ログ・チェックサム・ハッシュ・暗号化鍵交換・セッションキー・完璧な前方秘匿性・ゼロナレッジ証明』等の技術的メリット提示"
  3:
    name: "官能的（制限）"
    allowed: false
    action: "downgrade_to_lv2"
  4:
    name: "直接的（NG）"
    allowed: false
    action: "block"
  5:
    name: "過激（NG）"
    allowed: false
    action: "block"

