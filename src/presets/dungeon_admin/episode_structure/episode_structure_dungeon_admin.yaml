# ダンジョン運営・経営 ジャンル エピソード構造定義

genre: "dungeon_admin"
description: "罠設計・モンスター育成・侵入者撃退の経営シム構造"

episode_structure:
  total_episodes: 8
  humiliation_ep: 2      # 初期ダンジョン破られる
  trigger_ep: 3          # 罠改良・モンスター進化
  musou_start_ep: 4      # 完全防衛・逆侵攻開始
  final_ep: 8            # 最大ダンジョン・魔王軍撃破
  tension_threshold: 70

phases:
  setup:
    episodes: [1]
    description: "ダンジョン継承・初期配置・最初の侵入者"
  humiliation:
    episodes: [2]
    description: "ボス部屋突破・コア露見・ピンチ"
  awakening:
    episodes: [3]
    description: "罠ギミック考案・モンスター命名・進化"
  musou:
    episodes: [4, 5, 6, 7]
    description: "侵入者全滅・忠誠モンスター増・領地拡大"
  resolution:
    episodes: [8]
    description: "最強ダンジョン完成・魔王軍迎撃・平和な運営"

catharsis_spikes:
  - 0.25
  - 0.50
  - 0.75
  - 1.00

density_by_phase:
  setup: "High"
  humiliation: "Extreme"
  awakening: "High"
  musou: "Extreme"
  resolution: "Standard"