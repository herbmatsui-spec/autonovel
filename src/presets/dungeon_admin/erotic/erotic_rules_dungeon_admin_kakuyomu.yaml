# ダンジョン運営ジャンル・カクヨム投稿用 官能表現ルール
platform: "kakuyomu"
genre: "dungeon_admin"
max_intensity_level: 2

intensity_levels:
  1:
    name: "暗示的"
    description: "心理的緊張・雰囲気醸成。視線・距離感・魔力共鳴・魂の繋がり等。物理接触は手をつなぐ・肩触れる程度。"
    allowed: true
  2:
    name: "情緒的（上限）"
    description: "キス・抱擁・魔力供給・契約儀式等の『システム的・儀式的』親密行為。感情より『契約・主従・信頼・力の共有』文脈で描写。比喩で美的に。"
    allowed: true
    conditions:
      - "相手は『モンスター（人型/進化後）/使い魔/契約者/冒険者(稀)』等、ダンジョン戦力として明確な関係性ある相手"
      - "『魔力供給』『契約深化』『魂の共鳴』等のシステム的必然性ありき"
      - "事後は『ステータス上昇・スキル習得・絆深化』等のシステムメリット提示必須"
  3:
    name: "官能的（制限）"
    allowed: false
    action: "downgrade_to_lv2"
  4:
    name: "直接的（NG）"
    allowed: false
    action: "block"
  5:
    name: "過激（NG）"
    allowed: false
    action: "block"

ng_words:
  - "ベッド"
  - "夜の営み"
  - "初夜"
  - "処女"
  - "貫く"
  - "受け入れる"
  - "奥"
  - "最奥"
  - "蜜"
  - "濡れ"
  - "喘ぎ"
  - "果てる"
  - "絶頂"
  - "快楽"
  - "肉体関係"
  - "セックス"
  - "エッチ"

auto_replace:
  "ベッド": "寝台/魔力供給室"
  "夜の営み": "契約儀式/魔力供給"
  "初夜": "初契約"
  "処女": "未契約"
  "貫く": "繋がる/魔力注入"
  "受け入れる": "契約を結ぶ"
  "奥": "核/中心"
  "最奥": "魂の核"
  "蜜": "魔力/エリクサー"
  "濡れ": "魔力充填"
  "喘ぎ": "魔力吐出/呻き"
  "果てる": "魔力枯渇/契約完了"
  "絶頂": "魔力ピーク/共鳴極み"
  "快楽": "魔力昂揚/共鳴歓び"
  "肉体関係": "契約関係/主従関係"
  "セックス": "魔力交換/契約儀式"
  "エッチ": "イタズラ/悪戯(ダンジョン的文脈)"

scene_placement_rules:
  - "『魔力供給・契約深化・進化トリガー』等のシステム的必然性がある場合のみ"
  - "モンスター/使い魔の『進化・レア化・スキル習得』イベントとセットで"
  - "DM自身より『配下同士』『冒険者と配下』等の間で発生する方が自然（DMは『観察・記録・分析』役）"
  - "ハーレム展開の場合、『戦力バランス・属性相性・役割分担』で合理化"

required_tags:
  - "R15"

safety_manifest_injection: true
manifest_version: "dungeon_admin_v1"