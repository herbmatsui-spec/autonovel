# チート転生ジャンル・カクヨム投稿用 官能表現ルール
platform: "kakuyomu"
genre: "cheat_tensei"
max_intensity_level: 3

intensity_levels:
  1:
    name: "暗示的"
    description: "心理的緊張・雰囲気醸成。視線・溜息・空気感。接触は手をつなぐ・抱擁・キス（軽い）程度。"
    allowed: true
  2:
    name: "情緒的"
    description: "身体的惹きつけ・親密さ強調。キス・抱擁・衣服越し愛撫・一部肌の露出。体温・心拍・吐息中心。"
    allowed: true
  3:
    name: "官能的（上限）"
    description: "直接的な肌の接触・愛撫・情事プロセス美的描写。比喩活用でLv.4回避。同意必須・余韻必須。"
    allowed: true
    conditions:
      - "相手はパーティメンバー/ヒロイン/契約者等、信頼関係ある相手に限定"
      - "主人公の『余裕・支配力』を示す演出として活用"
      - "ハーレム展開の場合、順番・平等感・嫉妬劇を別途描写"
  4:
    name: "直接的（NG）"
    allowed: false
    action: "auto_replace_or_block"
  5:
    name: "過激（NG）"
    allowed: false
    action: "block"

ng_words:
  - "チンコ"
  - "マンコ"
  - "ペニス"
  - "ヴァギナ"
  - "クリトリス"
  - "亀頭"
  - "膣内"
  - "挿入"
  - "ピストン"
  - "中出し"
  - "射精"
  - "潮吹き"
  - "アヘ顔"
  - "イキまくり"
  - "肉棒"
  - "蜜壺"
  - "愛液"
  - "淫汁"
  - "雌"
  - "雄"

auto_replace:
  "チンコ": "そこ"
  "マンコ": "そこ"
  "ペニス": "熱いもの"
  "ヴァギナ": "秘所"
  "クリトリス": "核"
  "亀頭": "先端"
  "膣内": "最奥"
  "挿入": "繋がる"
  "ピストン": "動く"
  "中出し": "注ぎ込む"
  "射精": "果てる"
  "潮吹き": "溢れる"
  "アヘ顔": "恍惚の表情"
  "イキまくり": "何度も達する"
  "肉棒": "熱いもの"
  "蜜壺": "甘い奥"
  "愛液": "蜜"
  "淫汁": "濡れ"
