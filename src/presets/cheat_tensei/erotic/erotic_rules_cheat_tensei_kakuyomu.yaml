  "雄": "男"

scene_placement_rules:
  - "カタルシス（無双・レベルアップ・スキル習得）達成後の『報酬』として"
  - "ヒロイン/パーティメンバーとの信頼・絆深化の『証』として"
  - "主人公の『余裕・絶対的支配力』を示す演出として"
  - "ハーレムの場合、『順番・平等・個別の特別感』を丁寧に"

required_tags:
  - "R15"

safety_manifest_injection: true
manifest_version: "cheat_tensei_v1"