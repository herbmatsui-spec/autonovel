# TS転生ジャンル・カクヨム投稿用 官能表現ルール
platform: "kakuyomu"
genre: "ts_tensei"
max_intensity_level: 3

intensity_levels:
  1:
    name: "暗示的"
    description: "心理的緊張・雰囲気醸成。視線・距離感・手繋ぎ・頭撫で・髪梳き・膝枕・添い寝・頬キス・耳元囁き等。『尊さ・安心感・信頼・愛おしさ』表現に徹する。"
    allowed: true
    examples:
      - "彼女の髪を、優しく梳く。甘い香りが、指先に絡みつく。"
      - "膝枕で、彼女の寝顔を見守る。長いまつげが、頬に影を落とす。"
  2:
    name: "情緒的"
    description: "キス・抱擁・唇重ね・深い抱擁・体温共有・心拍同期・魔力共鳴等。『魂の繋がり・契約・眷属化・運命の相手』文脈。比喩（花開く・光溢れる・世界が変わる・溶け合う）で美的に。"
    allowed: true
    conditions:
      - "相手は『運命の相手/本命彼女/契約者/眷属』等、深い絆ある相手に限定"
      - "百合カップリング（女性×女性）のみ。男性との恋愛描写なし"
      - "事後は『余韻・余韻・余韻』3段落以上（感情の沈降・距離感再設定・次話伏線・尊さ余韻）"
  3:
    name: "官能的（上限・百合文脈）"
    description: "直接的な肌の接触・愛撫・百合的情事プロセス美的描写。比喩活用でLv.4回避。同意必須・余韻必須。『百合の官能』として『感情・感覚・精神の融解』に焦点。物理的描写より『感じ方・感情の動き・魂の繋がり』中心。"
    allowed: true
    conditions:
      - "相手は『本命/真のパートナー』に限定（ハーレムの場合『順番・平等・個別の特別感』厳守）"
      - "『百合』タグ・『ガールズラブ』タグ文脈内での表現"
      - "男性的視点・男性的描写（征服・支配・ピストン・中出し等）完全排除"
      - "『感情→感覚→心理変化・魂の融解・世界の書き換え』の3層構造維持"
  4:
    name: "直接的（NG）"
    allowed: false
    action: "block"
  5:
    name: "過激（NG）"
    allowed: false
    action: "block"

