  - [0.5, 0.85]    # ★第3カタルシス：ラスボス『第1形態〜最終形態』全パターン撃破・真のラスボス出現
  - [0.55, 0.70]   # 余韻・ループの『真の原因/黒幕/神/システム/世界の意志/自分』判明・衝撃の真実
  - [0.6, 0.75]    # 『ループ脱出条件/真エンド到達条件/世界救済の鍵』判明・最後の大勝負準備
  - [0.65, 0.80]   # 最終ループ直前・全知識・全スキル・全アイテム・全フラグ・全仲間『完全装備』完了
  - [0.7, 0.95]    # ★第4カタルシス：最終ループ開始・『完璧な立ち回り』・迷いゼロ・無駄ゼロ・最短最速
  - [0.75, 0.90]   # 全分岐『正解』選択・全キャラ『救済』・全謎『解明』・ラスボス『真の倒し方』実行
  - [0.8, 0.98]    # ★第5カタルシス：真エンド到達・『{{true_ending}}』達成・ループ脱出・時間正常化
  - [0.85, 0.80]   # 余韻・新しい時間軸での『平和・幸福・再会・日常・笑顔』・ループの記憶のみ残る
  - [0.9, 0.50]    # エピローグ・主人公『ループ経験者』としての『知恵・優しさ・強さ・余裕』で新生活
  - [0.95, 0.30]   # ふとした瞬間『デジャヴ』・『懐かしい感覚』・『あの頃の自分』への感謝・微笑み
