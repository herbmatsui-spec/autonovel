  - [0.05, 0.50]   # ループ発動・『{{loop_ability}}』覚醒・過去に戻る・記憶保持確認
  - [0.1, 0.60]    # 第2ループ・同じ失敗・微細な変化・フラグ分岐発見・希望の光
  - [0.15, 0.70]   # ★第1カタルシス：最初の『小さな成功』・キャラ1人救済/フラグ1つ回収・進歩実感
  - [0.2, 0.55]    # 余韻・データ蓄積・敵パターン暗記・最適ルート構築・ループ高速化
  - [0.25, 0.65]   # 100回目・1000回目・隠しイベント/隠しキャラ/真実の断片発見
  - [0.3, 0.80]    # ★第2カタルシス：中ボス『完全攻略』・全パターン把握・ノーダメージクリア・爽快感極大
  - [0.35, 0.60]   # 余韻・新たな制約発覚（ループ回数制限/記憶欠落/ステータスリセット/代償）
  - [0.4, 0.65]    # 制約下での『最適解探索』・『枝刈り・剪定・枝分かれ・収束』の知的快感
