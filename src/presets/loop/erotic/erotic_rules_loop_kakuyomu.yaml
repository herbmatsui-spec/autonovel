# ループジャンル・カクヨム投稿用 官能表現ルール
platform: "kakuyomu"
genre: "loop"
max_intensity_level: 2

intensity_levels:
  1:
    name: "暗示的"
    description: "心理的緊張・雰囲気醸成。視線・距離感・手繋ぎ・抱擁・頬キス・髪梳き・膝枕・添い寝等。『何度も繰り返したループの中で、初めて迎えた『今』の尊さ・確かな感触・変わらない愛』表現に徹する。"
    allowed: true
  2:
    name: "情緒的（上限）"
    description: "キス・抱擁・体温共有・心拍同期・涙・言葉なき理解・『もう、離さない』『今度こそ、守る』『{{loop_count}}回分の愛』等の『ループ経験者だからこそ描ける深さ・重み・確信』文脈。比喩（積み重ねた時間・無数の分岐の果ての正解・収束した世界線・確率1の未来・決定された運命・選ばれた世界線）で美的に。"
    allowed: true
    conditions:
      - "相手は『全ループで共に戦い・死に・生き抜いたパートナー/全ルートで救済し・愛され・愛したヒロイン/ループの外側から見守り続けた存在』等、深い絆・共有記憶ある相手"
      - "『ループの記憶・全試行の積み重ね・無数の失敗の果ての成功・確率0を1に変えた奇跡』等の文脈必須"
      - "事後は『余韻・余韻・余韻』3段落以上（ループ完了の安堵・記憶の統合・新しい時間軸での約束・もう二度と繰り返さない決意）"
  3:
    name: "官能的（制限）"
    allowed: false
    action: "downgrade_to_lv2"
  4:
    name: "直接的（NG）"
    allowed: false
    action: "block"
  5:
    name: "過激（NG）"
    allowed: false
    action: "block"

