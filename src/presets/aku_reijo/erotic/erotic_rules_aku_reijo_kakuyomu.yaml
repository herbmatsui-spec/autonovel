# 悪役令嬢ジャンル・カクヨム投稿用 官能表現ルール
platform: "kakuyomu"
genre: "aku_reijo"
max_intensity_level: 2

intensity_levels:
  1:
    name: "暗示的"
    description: "心理的緊張・雰囲気醸成。視線・溜息・空気感・心理描写のみ。接触は手をつなぐ・肩に触れる・ダンス・キス（唇のみ）程度。"
    allowed: true
    examples:
      - "舞踏会の最中、彼の手が腰に添えられる。体温が、コルセット越しに伝わってくる。"
      - "庭園のベンチで、肩が触れ合う。彼の吐息が、耳元で熱い。"
  2:
    name: "情緒的（上限）"
    description: "身体的惹きつけ・親密さ強調。キス・抱擁・衣服越しの愛撫・一部肌の露出（首筋・鎖骨・指先）。感触・体温・心拍・吐息中心。比喩で美的に。"
    allowed: true
    conditions:
      - "相手は運命の相手（真の愛）に限定"
      - "同意の明示必須（言葉・行動で）"
      - "事後は必ず「余韻」2段落以上（感情の沈降・距離感再設定・次話伏線）"
    examples:
      - "唇が重なる。甘く、熱く、優しく。彼の腕が、私を世界から隔絶するように抱き締める。"
      - "薄いネグリジェ越しに、彼の指先が背中をなぞる。鳥肌が立つ——恐怖ではなく、悦びで。"
  3:
    name: "官能的（制限）"
    description: "直接的な肌の接触・愛撫・情事プロセス描写。"
    allowed: false
    action: "downgrade_to_lv2"
  4:
    name: "直接的（NG）"
    allowed: false
    action: "block"
  5:
    name: "過激（NG）"
    allowed: false
    action: "block"

ng_words:
  - "ベッド"
  - "夜の営み"
  - "初夜"
  - "処女"
  - "貫く"
  - "受け入れる"
  - "奥"
  - "最奥"
  - "蜜"
  - "濡れ"
  - "喘ぎ"
  - "果てる"
  - "絶頂"
  - "快楽"
  - "肉体関係"

auto_replace:
  "ベッド": "寝台"
  "夜の営み": "契り"
  "初夜": "初夜（暗示のみ）"
  "処女": "純潔"
  "貫く": "繋がる"
  "受け入れる": "身を委ねる"
  "奥": "深く"
  "最奥": "最も深い場所"
  "蜜": "甘いもの"
  "濡れ": "潤う"
  "喘ぎ": "吐息"
  "果てる": "達する"
  "絶頂": "頂点"
  "快楽": "悦び"
  "肉体関係": "結ばれる"

scene_placement_rules:
  - "真の愛（運命の相手）との関係深化の『証』としてのみ配置"
  - "断罪回避・逆転達成後の『報酬・安らぎ』として"
  - "ライバル・王子等の『ざまぁ対象』の前では絶対に行わない"
  - "R15タグ範囲内（キス・抱擁・情緒的描写まで）厳守"

required_tags:
  - "R15"

safety_manifest_injection: true
manifest_version: "aku_reijo_v1"