# ざまぁ特化テンション曲線プロファイル
# 進行度(0.0-1.0) に対する目標テンション値(0.0-1.0)
# ざまぁ特有の「急激な絶望→溜め→爆発的カタルシス」を再現

curve_name: "zamaa_heavy_v2"
description: "ざまぁ・追放・無双ジャンル専用。ストレス急上昇→閾値到達で強制カタルシス→解放の波を複数回配置"

# ストレス閾値（この値を超えると強制カタルシス発動）
stress_threshold: 75

# カタルシススパイク発生位置（進行度）
# 8話構成の場合: 0.25=2話, 0.5=4話, 0.75=6話, 1.0=8話
catharsis_spikes:
  - 0.25
  - 0.50
  - 0.75
  - 1.0

# 曲線定義: (進行度, テンション値)
# 0.0: 導入（平穏から不穏へ）
# 0.1: 追放・裏切り（急激な絶望・ストレス最大）
# 0.25: 第1カタルシス（覚醒・反撃開始）
# 0.4: 新たな敵・試練（ストレス再蓄積）
# 0.5: 第2カタルシス（中盤ボス撃破・仲間獲得）
# 0.65: 最大の危機・裏切りの真相（ストレス最高潮）
# 0.75: 第3カタルシス（真の力覚醒・大逆転）
# 0.9: 最終決戦前夜（緊張最高潮）
# 1.0: 第4カタルシス（完全勝利・完全制圧・平穏へ）

curve_points:
  - [0.0, 0.15]    # 静かな日常・伏線
  - [0.05, 0.35]   # 不穏な兆候
  - [0.1, 0.90]    # 追放・裏切り・絶望の底（ストレス最大）
  - [0.15, 0.85]   # 奈落での苦悩・生存
  - [0.2, 0.70]    # 力の兆し・希望の光
  - [0.25, 0.95]   # ★第1カタルシス：覚醒・初撃・ざまぁ開始
  - [0.3, 0.60]    # 余韻・新展開へ
  - [0.35, 0.65]   # 新たな敵・試練
  - [0.4, 0.80]    # ストレス再蓄積
  - [0.45, 0.85]   # 追い詰められる
  - [0.5, 0.98]    # ★第2カタルシス：中盤ボス撃破・大勝
  - [0.55, 0.55]   # 余韻・仲間・拠点獲得
  - [0.6, 0.70]    # 新章・謎の深まり
  - [0.65, 0.95]   # 最大危機・真相・裏切りの黒幕
  - [0.7, 0.90]    # 絶体絶命
  - [0.75, 1.00]   # ★第3カタルシス：真の力・大逆転
  - [0.8, 0.70]    # 余韻・最終決戦準備
  - [0.85, 0.85]   # 最終決戦・クライマックス
  - [0.9, 0.95]    # 決着直前・最高潮
  - [1.0, 0.05]    # ★第4カタルシス：完全勝利・平穏・新秩序

# フック戦略パラメータ
hook_strength: 0.9
opening_hook_intensity: 0.95
closing_hook_intensity: 0.95

# カタルシス強度（0.0-1.0）
catharsis_intensity: 1.0

# 描写密度レベル（各フェーズ）
density_by_phase:
  setup: "High"          # 導入部：世界観・キャラ丁寧に
  humiliation: "Extreme" # 屈辱パート：描写密度最大で読者の怒りを煽る
  awakening: "Extreme"   # 覚醒・初撃：カタルシスシーンは極致
  development: "High"    # 展開部：バランスよく
  crisis: "Extreme"      # 最大危機：極致
  climax: "Extreme"      # クライマックス：極致
  resolution: "Standard" # 結末：標準で余韻を残す