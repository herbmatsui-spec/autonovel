# ざまぁジャンル・カクヨム投稿用 官能表現ルール
# Lv.3を上限とし、プラットフォーム規約（カクヨム）に完全準拠

platform: "kakuyomu"
genre: "zarma"
max_intensity_level: 3

# 官能強度レベル定義（erotic_intensity_standards.md準拠）
intensity_levels:
  1:
    name: "暗示的"
    description: "心理的緊張・雰囲気醸成。視線・溜息・空気感・心理描写のみ。接触は手をつなぐ・肩に触れる程度。"
    allowed: true
    examples:
      - "指先が触れ合うだけで、背筋に電流が走った。"
      - "彼女の吐息が、首筋にかかる。それだけで、理性が溶けそうになる。"
  2:
    name: "情緒的"
    description: "身体的惹きつけ・親密さ強調。体温・心拍・肌の質感・軽い接触。キス・抱擁・衣服越し・一部肌の露出。感触記述中心。"
    allowed: true
    examples:
      - "唇が重なる。甘く、熱い感触。彼女の体温が、直接伝わってくる。"
      - "薄い布一枚越しに、彼女の鼓動が手のひらに響く。速く、激しく。"
  3:
    name: "官能的（上限）"
    description: "身体的快楽・熱情の直接描写。吐息・喘ぎ・密着・身体的反応。衣服を脱ぐ過程・愛撫・直接的な肌の接触。情事プロセスを美的に描写。比喩活用でLv.4回避。"
    allowed: true
    conditions:
      - "同意の明示（明示的または暗黙的）必須"
      - "未成年・非合意・近親・暴力伴う性行為は絶対禁止"
      - "生殖器直接名称は使用せず、感覚・温度・呼吸で表現"
      - "「感情→身体反応→心理変化」の3層構造維持"
      - "事後は必ず「余韻（afterglow）」2段落以上記述"
    examples:
      - "肌と肌が溶け合う。境界が曖昧になり、ただ熱だけが在る。"
      - "彼女の喘ぎ声が、部屋中に響き渡る。俺の名前を、祈りのように呼ぶ。"
      - "全てが白く閃いた瞬間、世界が再構成された。彼女の中に、俺という『答え』が在る。"
  4:
    name: "直接的（制限/NG）"
    description: "具体的かつ詳細な行為描写。性器直接言及・具体的結合描写。行為のメカニズム・露骨な身体部位名称使用。"
    allowed: false
    action: "auto_replace_or_block"
  5:
    name: "過激（セルフホスト専用）"
    description: "極限の感覚変容・精神的溶解。身体境界消失・理性崩壊・快楽飽和。物理的描写超えた感覚的表現。"
    allowed: false
    action: "block"

