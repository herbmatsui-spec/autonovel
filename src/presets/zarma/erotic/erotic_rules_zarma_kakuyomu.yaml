# ざまぁジャンル特有の官能シーン配置ルール
scene_placement_rules:
  - "カタルシス（ざまぁ）達成後の『報酬』として配置"
  - "ヒロイン（メイン/サブ）との信頼関係構築後の『絆の証』として配置"
  - "主人公の『余裕・支配力』を示す演出として活用"
  - "ざまぁ対象（敵・元仲間）の目の前で行う『見せつけ』は避ける（品位保持）"
  - "ハーレム展開の場合、順番・平等感に配慮し嫉妬劇を別途描写"

# 必須タグ（カクヨム投稿時）
required_tags:
