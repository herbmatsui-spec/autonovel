# Nginx configuration for AutoNovel backend (SSE-friendly)

# Place this file under /etc/nginx/conf.d/autonovel.conf (or include from your server block).
# SSE 経路 (EventSource) はバッファリングせずに逐次クライアントへ転送する必要があるため、
# `proxy_buffering off` と `X-Accel-Buffering: no` を必ず設定する。

upstream autonovel_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 通常の API
    location / {
        proxy_pass http://autonovel_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE: ストリーミング生成
    location /easy_mode/generate/stream {
        proxy_pass http://autonovel_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no always;
        chunked_transfer_encoding on;
    }

    # 既存の SSE: タスク進捗
    location /api/ {
        proxy_pass http://autonovel_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
