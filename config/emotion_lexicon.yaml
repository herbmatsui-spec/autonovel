# 依存構造ベース共起パターン
# (主語依存関係, 目的語依存関係, 感情タイプ, 重み)
dependency_patterns:
  - ["nsubj", "dobj", "affection", 1.0]
  - ["nsubj", "iobj", "affection", 0.8]
  - ["nsubj", "obl", "affection", 0.7]
  - ["nsubj", "dobj", "tension", 0.9]
  - ["nsubj", "dobj", "fear", 0.9]
  - ["nsubj", "dobj", "anger", 0.9]
  - ["nsubj", "dobj", "trust", 0.8]
  - ["nsubj", "dobj", "jealousy", 0.7]
  - ["nsubj", "dobj", "sadness", 0.7]
  - ["nsubj", "dobj", "disgust", 0.8]
  # 「AはBに恐怖」パターン
  - ["nsubj", "obl:に", "fear", 1.0]
  - ["nsubj", "obl:に", "trust", 0.8]
  # 「AはBを裏切った」→ BはAに不信
  - ["nsubj", "dobj", "affection", -0.8]  # 負の重みで逆転
  # 被動態「AはBに裏切られた」→ AはBに恐怖/不信
  - ["nsubj:pass", "obl:に", "fear", 0.9]
  - ["nsubj:pass", "obl:に", "affection", -0.7]
  # 形容詞述語「AはBが怖い」
  - ["nsubj", "acl:relcl", "fear", 0.8]
  - ["nsubj", "acl", "affection", 0.7]

# 感情極性反転トリガー動詞（主語→目的語の感情を反転）
polarity_flip_verbs:
  - "裏切る"
  - "騙す"
  - "捨てる"
  - "見捨てる"
  - "殺す"
  - "傷つける"
  - "裏切"
  - "欺く"
  - "利用する"
  - "利用し"
  - "陥れる"
  - "罠"
  - "謀る"

# 感情増幅修飾語
intensifiers:
  - "底知れぬ"
  - "深い"
  - "強い"
  - "激しい"
  - "尋常でない"
  - "並々ならぬ"
  - "並外れ"
  - "極限"
  - "限界"
  - "最大"
  - "絶対的"
  - "完全に"
  - "徹底的に"

# 感情減衰修飾語
attenuators:
  - "少し"
  - "わずか"
  - "微か"
  - "薄い"
  - "弱い"
  - "多少"
  - "幾分"
  - "若干"
  - "ほんのり"
  - "ぼんやり"