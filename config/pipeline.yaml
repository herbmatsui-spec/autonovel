# パイプライン設定 (Week 2 Step 15)
pipeline:
  # ルールエンジンステージ (Week 2 ベースライン生成)
  rule_engine:
    enabled: true
    rules_path: "config/emotional_rules.yaml"
    events_path: "config/plot_events.yaml"

  # ネームスペース分離 (Week 1-3)
