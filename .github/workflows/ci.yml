name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 同時実行: PR では進行中ジョブをキャンセルしてリソース節約
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------
  # 1. Lint (ruff + ruff format --check)
  # ----------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff check
        run: ruff check src tests
      - name: ruff format --check
        run: ruff format --check src tests

  # ----------------------------------------------------------------------
  # 2. Type check (mypy)
  # Phase 1: ignore_missing_imports は残しつつ || true を削除し CI で fail させる
  # Phase 3: --strict を追加し段階導入
  # ----------------------------------------------------------------------
  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: mypy
        run: mypy src --ignore-missing-imports

  # ----------------------------------------------------------------------
  # 3. black format check (pyproject.toml line-length=100 と一致)
  # ----------------------------------------------------------------------
  black-check:
    name: Black Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black
      - name: black --check
        run: black --check src tests

  # ----------------------------------------------------------------------
  # 4. Unit tests + coverage gate
  # ----------------------------------------------------------------------
  test-unit:
    name: Unit Tests (coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest tests/unit (cov-fail-under=40)
        run: |
          pytest tests/unit \
            --cov=src --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=40
      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage.xml

  # ----------------------------------------------------------------------
  # 5. Integration tests (PostgreSQL + Redis サービス)
  # ----------------------------------------------------------------------
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: autonovel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run migrations
        run: |
          cd src/backend
          alembic upgrade head
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/autonovel_test
      - name: pytest tests/integration
        run: pytest tests/integration -v --tb=short
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/autonovel_test
          REDIS_URL: redis://localhost:6379/0

  # ----------------------------------------------------------------------
  # 6. Contract tests (OpenAPI スナップショット・Pydantic スキーマ)
  # Phase 2 で本格実装。Phase 1 では枠組みだけ用意し CI で実行開始。
  # ----------------------------------------------------------------------
  test-contract:
    name: Contract Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: autonovel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest tests/contract
        run: pytest tests/contract -v --tb=short

  # ----------------------------------------------------------------------
  # 7. Migration integrity (alembic check + upgrade/downgrade 往復)
  # ----------------------------------------------------------------------
  test-migration:
    name: Migration Integrity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: autonovel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: alembic upgrade head
        run: |
          cd src/backend
          alembic upgrade head
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/autonovel_test
      - name: alembic check (model drift detection)
        run: |
          cd src/backend
          alembic check
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/autonovel_test
      - name: alembic round-trip
        run: |
          cd src/backend
          alembic downgrade -1
          alembic upgrade head
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/autonovel_test

  # ----------------------------------------------------------------------
  # 8. Performance regression tests (benchmarks.json ベースライン)
  # Phase 2 で本格実装。Phase 1 では枠組みだけ用意。
  # ----------------------------------------------------------------------
  test-perf:
    name: Performance Regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: autonovel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest tests/perf
        run: |
          pytest tests/perf -v --tb=short \
            --benchmark-only \
            --benchmark-columns=mean,stddev,median \
            --benchmark-autosave
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/autonovel_test

  # ----------------------------------------------------------------------
  # 9. Frontend tests (vitest + lint + typecheck)
  # ----------------------------------------------------------------------
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: npm run lint
        run: npm run lint
      - name: npm run typecheck
        run: npm run typecheck
      - name: npm run test:ci
        run: npm run test:ci

  # ----------------------------------------------------------------------
  # 10. Build Docker image (main push のみ)
  # ----------------------------------------------------------------------
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - black-check
      - test-unit
      - test-integration
      - test-contract
      - test-migration
      - frontend-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t autonovel:latest .
      - name: Push to registry
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker tag autonovel:latest ${{ secrets.DOCKER_REGISTRY }}/autonovel:${{ github.sha }}
          docker push ${{ secrets.DOCKER_REGISTRY }}/autonovel:${{ github.sha }}
