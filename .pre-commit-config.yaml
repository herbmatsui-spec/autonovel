# pre-commit フック設定
# インストール: pre-commit install
# 実行: pre-commit run --all-files
# 更新: pre-commit autoupdate

repos:
  # ===================== 基本チェック =====================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs

  # ===================== Python フォーマット・Lint =====================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        # ruff format も実行
      - id: ruff-format

  # ===================== 型チェック =====================
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: [
          "pydantic",
          "pydantic-settings",
          "fastapi",
          "sqlalchemy",
          "redis",
          "chromadb",
          "google-generativeai",
          "openai",
          "httpx",
          "dependency-injector",
          "pydantic-settings",
          "prometheus-client",
        ]
        args: [
          "--strict",
          "--ignore-missing-imports",
          "--namespace-packages",
          "--explicit-package-bases",
          "--show-error-codes",
          "--pretty",
        ]
        # 型チェックが遅い場合はキャッシュ活用
        # cache_dir: .mypy_cache

  # ===================== セキュリティ =====================
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: [
          "-r", "src/",
          "-ll",  # Low 以上のみ報告
          "-x", "tests/",  # テスト除外
          "--skip", "B101,B601",  # assert使用, subprocess使用は許容
        ]
      - id: bandit
        args: [
          "-r", "config/",
          "-ll",
          "--skip", "B108",  # ハードコードパスワード (設定ファイルなので許容)
        ]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks
        args: ["--verbose", "--redact"]

  # ===================== 依存関係脆弱性 =====================
  - repo: https://github.com/pycqa/pip-audit
    rev: v2.7.0
    hooks:
      - id: pip-audit
        args: [
          "-r", "requirements.txt",
          "--desc", "on",
          "--format", "json",
          "--output", "pip-audit-report.json",
        ]

  # ===================== 複雑度チェック =====================
  - repo: https://github.com/PyCQA/xenon
    rev: 0.9.0
    hooks:
      - id: xenon
        args: [
          "--max-absolute", "F",      # 絶対複雑度 F 以下 (現状ベースライン、将来的に引き上げ)
          "--max-modules", "F",       # モジュール複雑度 F 以下
          "--max-average", "A",       # 平均複雑度 A 以下
          "--exclude", "tests/",      # テスト除外
        ]

  # ===================== デッドコード検出 =====================
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.10
    hooks:
      - id: vulture
        args: [
          "--min-confidence", "80",
          "--exclude", "tests/,docs/,config/,scripts/,*/migrations/",
          "--ignore-decorators", "@property,@classmethod,@staticmethod",
          "src/",
        ]

  # ===================== コミットメッセージ =====================
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.20.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # ===================== インポート順序 =====================
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [
          "--profile", "black",
          "--filter-files",
        ]

  # ===================== シークレット検出 (ローカル) =====================
  - repo: local
    hooks:
      - id: no-print-statements
        name: "No print statements in production code"
        entry: python scripts/no_print_check.py
        language: python
        types: [python]
        exclude: ^tests/

  - repo: local
    hooks:
      - id: no-hardcoded-secrets
        name: "No hardcoded secrets"
        entry: python scripts/check_secrets.py
        language: python
        types: [python, toml, yaml]
        exclude: ^tests/|^\.env\.example$

# ===================== 設定オプション =====================
default_language_version:
  python: python3.12

default_stages: [pre-commit, pre-push]

fail_fast: true  # 最初のエラーで停止