# ==============================================================================
# 50話×3000文字 小説設定ファイル (world.yaml) - ステップ3〜7, 10
# ==============================================================================

# ステップ3: ジャンル
genre: "光層ファンタジー"

# 作品基本情報
title: "輝石の遺産 〜階層都市の黎明記〜"
target_chars_per_ep: 3000
total_episodes: 75

# ステップ4: 主人公
protagonist:
  name: "凛（リン）"
  age: 18
  personality: "冷静沈着で観察眼に優れ、一度決めた誓いは決して曲げない芯の強さを持つ。"
  motivation: "失われた家族の真相を突き止め、闇に沈みゆく光層都市を救い出すこと。"
  appearance: "18歳の少女。腰まで届く銀色の長髪に、藍色の光術士袍を纏い、胸元に輝核石のペンダントを提げる。"

# ステップ5: 舞台世界のシンボル
symbol: "光の石"
world_setting: "天空へと伸びる多層都市『光層ルクス』。光の石の輝きによって魔獣から護られているが、近年その光脈が急激に減衰している。"

# ステップ6: 敵対勢力
antagonist:
  name: "闇結社『虚無の爪』"
  leader: "仮面の導師・ヴェルヘルム"
  summary: "光の石を強奪・破壊し、世界を原初の闇と混沌に還そうと暗躍する凶悪な結社。"
  appearance: "漆黒のマントに紫紺の紋様を纏い、顔は仮面で覆われた謎の集団。導師は白銀の仮面と長い黒衣。"

# ステップ7: 主要サブキャラ2名

# 追加設定: 第51話〜75話 中盤加速アーク (ステップ4.1)
arc_mid_game:
  phase_a:
    episodes: "51-60"
    theme: "浸食と予兆"
    key_events: ["Rinの能力の真の目的の提示", "信頼していた者の裏切りまたは窮地", "ルクスの光脈の致命的な減衰"]
  phase_b:
    episodes: "61-70"
    theme: "反撃の準備と代償"
    key_events: ["能力の再定義と限界突破", "仲間との絆の深化", "禁忌の知識の獲得"]
  phase_c:
    episodes: "71-75"
    theme: "中盤の決戦"
    key_events: ["闇結社幹部との直接対決", "中ボス撃破とさらなる絶望の提示", "黒幕ヴェルヘルムの真の目的の断片的な開示"]
subcharacters:
  - name: "セリア"
    role: "古代光術を解読するナビ役の神殿巫女。豊富な知識で凛を支えるが、時折無鉄砲な好奇心を見せる。"
    appearance: "白金のローブに黄金の聖印を刻んだ巫女装束。琥珀色の瞳と桃色の髪を結い上げ、古書を携える。"
  - name: "ガルド"
    role: "重層鎧を纏う歴戦の大剣士。ぶっきらぼうだが義理堅く、前線で凛の盾となり突破口を切り開く。"
    appearance: "黒鉄の重層鎧に巨大な大剣を背負った大柄な戦士。浅黒い肌と短く刈り上げた髭、眼光の鋭い男。"
